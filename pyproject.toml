[project]
name = "smart-ledger"
version = "0.1.0"
description = "Excel-based personal expense ledger with a Flask UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1,<4",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "qrcode>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false
required-version = ">=0.12.17"
