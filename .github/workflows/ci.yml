name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and lint (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: latest
          enable-cache: true

      - name: Set up Python and dependencies
        run: uv sync --locked --python 3.12

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Check block spacing
        run: uv run --locked python tools/insert_block_blank_lines.py --check smart_ledger tests tools app.py

      - name: Run tests
        run: uv run --locked pytest -q

  windows-setup:
    name: Windows uv auto-install smoke test
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test initial setup with simulated WinGet and uv
        shell: powershell
        run: .\tests\windows\test_setup_auto_install.ps1
