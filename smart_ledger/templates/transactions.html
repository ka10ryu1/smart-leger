{% extends "base.html" %}
{% from "_tx_list.html" import tx_list %}
{% block title %}明細一覧{% endblock %}
{% block content %}
<h1>明細一覧</h1>
<form method="get" class="filters card">
  <label>月
    <select name="month">
      <option value="">すべて</option>
      {% for m in months %}<option value="{{ m }}" {{ 'selected' if m == filters.month }}>{{ m|month_label }}</option>{% endfor %}
    </select>
  </label>
  <label>カテゴリ
    <select name="category">
      <option value="">すべて</option>
      {% for c in categories %}<option value="{{ c }}" {{ 'selected' if c == filters.category }}>{{ c }}</option>{% endfor %}
    </select>
  </label>
  <label>分類
    <select name="source">
      <option value="">すべて</option>
      {% for s in ['rule', 'jev', 'manual', 'error'] %}<option value="{{ s }}" {{ 'selected' if s == filters.source }}>{{ s|source_label }}</option>{% endfor %}
    </select>
  </label>
  <label>加盟店
    <input type="search" name="q" value="{{ filters.q }}" placeholder="加盟店名で検索">
  </label>
  <button class="btn btn-primary" type="submit">絞り込む</button>
  <a class="btn" href="{{ url_for('ledger.transactions') }}">クリア</a>
</form>
<p class="summary-line">{{ transactions|length }} 件 / 合計 <strong>{{ total|yen }} 円</strong></p>
{{ tx_list(transactions, alloc_ids) }}
{% endblock %}
